</div>
</div>
</section>
<section class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2 rounded-xl p-4 sm:p-6 bg-white/5 dark:bg-black/20 border border-white/10">

<div class="text-sm font-normal leading-normal pb-4 text-slate-400 dark:text-slate-500">

<p>Session ID: SJC-01-A-47291</p>
<p>Charger ID: CHG-001A</p>

<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-14 bg-[#D50000] text-white gap-2 text-lg font-bold leading-normal tracking-[0.015em] px-6 transition-colors hover:bg-red-700">
